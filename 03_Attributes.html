<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>03_Attributes</title>
    </head>
    <body>
        <a href="html.jpg">HTML</a>
        <br>
        <img src="html.jpg" alt="HTML" width="200" height="100">
        <!--
        alt shows alternative text if the image for some reason cannot be displayed-->

        <p style="color: blue;"> This is a blue Paragraph</p>
        <p title="This show extra info while hovering mouse">My name is Pratoy Barua</p>

    </body>
</html>
