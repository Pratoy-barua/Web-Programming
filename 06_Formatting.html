<!DOCTYPE html>
<html>
    <head>
        <title>06_Formatting</title>
    </head>
    <body style="background-color: bisque;">
        <!--
Formatting elements were designed to display special types of text:
<b> - Bold text
<strong> - Important text, bold
<i> - Italic text
<em> - Emphasized text
<mark> - Marked text
<small> - Smaller text
<del> - Deleted text
<ins> - Inserted text
<sub> - Subscript text
<sup> - Superscript text
    -->

    <b style="font-family: verdana; font-size: 40px;">this is bold text</b>
    <br>
    <strong>this is important text</strong>
    <br>
    <i>this is italic</i>
    <br>
    <em>this is emphasized text</em>
    <br>
    <mark>this is marked text</mark>
    <br>
    <small>this is small text</small>
    <br>
    <del>this is deleted text</del>
    <br>
    <ins>this is inseted text, underline</ins>
    <br>
    <p>This is<sub>subcript text</sub>and this is<sup>superscript</sup></p>

    </body>
</html>
