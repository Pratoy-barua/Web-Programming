<!DOCTYPE html>
<html>
    <head>
        <title>11_Class & ID</title>
    </head>

    <style>
        .class{
            background-color: aqua;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        #id{
            background-color: bisque;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
    </style>
    <body>
        <div class="class">
            <h1>Class can use in multiple html elements</h1>
        </div>
        <br>
        <div id="id">
            <h1>Id name nust only used by only one html element</h1>
        </div>
    </body>
</html>
